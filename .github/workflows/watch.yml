name: watch
on:
  schedule:
    - cron: "0 1 * * *"     # 8h00 VN  -> chạy 8h-12h
    - cron: "0 6 * * *"     # 13h00 VN -> chạy 13h-18h
    - cron: "0 11 * * *"    # 18h00 VN -> chạy 18h-22h
  workflow_dispatch:         # cho phép bấm chạy tay

concurrency:
  group: watch
  cancel-in-progress: true   # lượt mới thay lượt cũ, không chạy trùng

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -u watch_github.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          START_H: ${{ github.event.schedule == '0 6 * * *' && '13' || github.event.schedule == '0 11 * * *' && '18' || '8' }}
          END_H: ${{ github.event.schedule == '0 1 * * *' && '12' || github.event.schedule == '0 6 * * *' && '18' || '22' }}
